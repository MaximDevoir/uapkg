name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check formatting, lint, and types
        run: vp check
      - name: Run tests
        run: vp test run
      - name: Build production artifacts
        run: vp run build -- --production
      - name: Verify the production CLI
        run: vp -C packages/uapkg run verify:production-build
      - name: Pack workspace packages for runtime smoke tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uapkg-packages"
          for package_manifest in packages/*/package.json; do
            package_directory="$(dirname "$package_manifest")"
            vp -C "$package_directory" pm pack --pack-destination "$RUNNER_TEMP/uapkg-packages"
          done
      - name: Upload packed workspace packages
        uses: actions/upload-artifact@v4
        with:
          name: uapkg-workspace-packages
          path: ${{ runner.temp }}/uapkg-packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  packed-cli-smoke:
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: uapkg-workspace-packages
          path: ${{ runner.temp }}/uapkg-packages
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install and run the packed CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uapkg-smoke"
          npm install --prefix "$RUNNER_TEMP/uapkg-smoke" "$RUNNER_TEMP/uapkg-packages/"*.tgz
          expected_version="$(node -p "require('./packages/uapkg/package.json').version")"
          actual_version="$("$RUNNER_TEMP/uapkg-smoke/node_modules/.bin/uapkg" --version)"
          test "$actual_version" = "$expected_version"
