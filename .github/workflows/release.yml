name: Release

on:
  push:
    branches:
      - main
permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: write

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run build -- --production
      - run: vp -C packages/uapkg run verify:production-build

      - name: Create Release Pull Request or Release
        uses: changesets/action@v1
        with:
          publish: vp run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The artifacts were built and verified above. Avoid concurrent pnpm publish
          # hooks rebuilding and cleaning the same workspace package outputs.
          PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
